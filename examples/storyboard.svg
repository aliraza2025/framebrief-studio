<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1305" viewBox="0 0 1200 1305"><rect width="1200" height="1305" fill="#f4efe7"/><g font-family="sans-serif" fill="#25241f"><text x="50" y="58" font-size="32">After Hours / FRAMEBRIEF</text><text x="50" y="90" font-size="16">30s · portrait · planning artifact</text><g transform="translate(50 130)"><rect width="1100" height="210" rx="14" fill="#fffdf8"/><rect x="18" y="18" width="185" height="174" rx="8" fill="#294a43"/><text x="42" y="70" fill="#fffdf8" font-size="48">01</text><text x="42" y="110" fill="#fffdf8" font-size="18">0–6s</text><text x="230" y="38" font-size="22">The moment</text><text x="230" y="72" font-size="16">A quiet closing-time scene for Independent café owners. </text><text x="230" y="157" font-size="16" fill="#56635d">The day ends. The questions keep coming. </text></g><g transform="translate(50 365)"><rect width="1100" height="210" rx="14" fill="#fffdf8"/><rect x="18" y="18" width="185" height="174" rx="8" fill="#845145"/><text x="42" y="70" fill="#fffdf8" font-size="48">02</text><text x="42" y="110" fill="#fffdf8" font-size="18">6–12s</text><text x="230" y="38" font-size="22">The friction</text><text x="230" y="72" font-size="16">Hold on a ringing phone beside an empty counter. </text><text x="230" y="157" font-size="16" fill="#56635d">One missed conversation. One missed opportunity. </text></g><g transform="translate(50 600)"><rect width="1100" height="210" rx="14" fill="#fffdf8"/><rect x="18" y="18" width="185" height="174" rx="8" fill="#2c394a"/><text x="42" y="70" fill="#fffdf8" font-size="48">03</text><text x="42" y="110" fill="#fffdf8" font-size="18">12–18s</text><text x="230" y="38" font-size="22">The shift</text><text x="230" y="72" font-size="16">Introduce After Hours through an abstract conversation interface. </text><text x="230" y="157" font-size="16" fill="#56635d">Keep the conversation going after the lights go out. </text></g><g transform="translate(50 835)"><rect width="1100" height="210" rx="14" fill="#fffdf8"/><rect x="18" y="18" width="185" height="174" rx="8" fill="#294a43"/><text x="42" y="70" fill="#fffdf8" font-size="48">04</text><text x="42" y="110" fill="#fffdf8" font-size="18">18–24s</text><text x="230" y="38" font-size="22">The proof to capture</text><text x="230" y="72" font-size="16">Show a real, permission-cleared product interaction. Replace this placeholder before </text><text x="230" y="95" font-size="16">publishing. </text><text x="230" y="157" font-size="16" fill="#56635d">Show the workflow. Let people inspect it. </text></g><g transform="translate(50 1070)"><rect width="1100" height="210" rx="14" fill="#fffdf8"/><rect x="18" y="18" width="185" height="174" rx="8" fill="#845145"/><text x="42" y="70" fill="#fffdf8" font-size="48">05</text><text x="42" y="110" fill="#fffdf8" font-size="18">24–30s</text><text x="230" y="38" font-size="22">The invitation</text><text x="230" y="72" font-size="16">Return to the opening composition with a warmer light. </text><text x="230" y="157" font-size="16" fill="#56635d">Invite owners to explore an after-hours receptionist demo. </text></g></g></svg>